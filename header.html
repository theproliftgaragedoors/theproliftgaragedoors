<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProLift Garage Doors</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/webp" sizes="48x48" href="https://theproliftgaragedoors.com/images/prolift-garage-doors-logo.webp"/>
<style>
:root{
  --ink:#0d1117;--ink2:#161d26;--ink3:#1e2833;--steel:#2a3540;
  --mist:#8e9ba8;--fog:#c4cdd6;--snow:#f2f4f6;--white:#ffffff;
  --teal:#0c8075;--teal2:#0fa898;--teal3:#12c4b2;--amber:#e8a020;
  --r4:4px;--r8:8px;--r12:12px;--r16:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--ink);color:var(--white);-webkit-font-smoothing:antialiased}

/* ── HEADER SHELL ── */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  background:rgba(13,17,23,.9);
  border-bottom:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:background .3s,border-color .3s
}
.site-header.scrolled{
  background:rgba(13,17,23,.98);
  border-bottom-color:rgba(12,128,117,.25)
}
.hdr-inner{
  max-width:1280px;margin:0 auto;
  padding:0 36px;height:70px;
  display:flex;align-items:center;
  position:relative
}

/* ── LOGO ── */
.hdr-logo{
  display:flex;align-items:center;flex-shrink:0;
  text-decoration:none;z-index:1
}
.hdr-logo img{
  height:54px;width:auto;
  filter:drop-shadow(0 0 8px rgba(12,196,178,.12))
}

/* ── NAV — truly centered ── */
.hdr-nav{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:2px
}
.hdr-nav > a{
  font-size:13px;font-weight:500;color:var(--mist);
  text-decoration:none;padding:8px 13px;border-radius:var(--r8);
  transition:color .15s,background .15s;white-space:nowrap
}
.hdr-nav > a:hover{color:var(--white);background:rgba(255,255,255,.06)}

/* ── SERVICES MEGA DROP ── */
.mega-wrap{position:relative}
.mega-trigger{
  display:flex;align-items:center;gap:5px;
  font-size:13px;font-weight:500;color:var(--mist);
  padding:8px 13px;border-radius:var(--r8);cursor:pointer;
  background:none;border:none;font-family:inherit;white-space:nowrap;
  transition:color .15s,background .15s
}
.mega-trigger:hover,.mega-wrap:focus-within .mega-trigger{
  color:var(--white);background:rgba(255,255,255,.06)
}
.mega-trigger svg{width:11px;height:11px;fill:var(--mist);transition:transform .22s}
.mega-wrap:hover .mega-trigger svg,
.mega-wrap:focus-within .mega-trigger svg{transform:rotate(180deg);fill:var(--teal3)}

/* The panel — attached RIGHT to the trigger, not the viewport */
.mega-panel{
  position:absolute;
  top:calc(100% + 10px);
  left:50%;
  transform:translateX(-50%) translateY(-6px);
  width:640px;
  background:var(--ink2);
  border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r16);
  padding:20px;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  /* keep panel reachable when cursor moves down toward it */
}
/* invisible bridge so cursor doesn't lose hover */
.mega-panel::before{
  content:'';position:absolute;top:-14px;left:0;right:0;height:14px
}
.mega-wrap:hover .mega-panel{
  opacity:1;pointer-events:all;
  transform:translateX(-50%) translateY(0)
}

.mega-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 12px;border-radius:var(--r8);
  text-decoration:none;transition:background .15s;
  color:var(--mist)
}
.mega-item:hover{background:rgba(255,255,255,.06);color:var(--white)}
.mega-item:hover .mi-title{color:var(--white)}
.mega-item:hover .mi-icon{background:rgba(12,128,117,.25);border-color:rgba(12,128,117,.4)}
.mi-icon{
  width:32px;height:32px;flex-shrink:0;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r8);display:flex;align-items:center;justify-content:center;
  transition:all .15s;margin-top:1px
}
.mi-icon svg{width:15px;height:15px;fill:var(--teal2)}
.mi-title{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.75);display:block;line-height:1.3;margin-bottom:2px}
.mi-sub{font-size:11px;font-weight:300;color:var(--mist);line-height:1.4}

/* mega footer row */
.mega-footer{
  grid-column:1/-1;
  margin-top:8px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:space-between;gap:12px
}
.mega-all{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;color:var(--teal3);
  text-decoration:none;padding:8px 14px;
  border:1px solid rgba(12,128,117,.3);border-radius:var(--r8);
  background:rgba(12,128,117,.08);transition:all .15s
}
.mega-all:hover{background:rgba(12,128,117,.18);border-color:rgba(12,128,117,.5)}
.mega-all svg{width:13px;height:13px;fill:var(--teal3)}
.mega-badge{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:500;color:rgba(255,255,255,.25)
}
.mega-badge svg{width:12px;height:12px;fill:rgba(12,128,117,.5)}

/* ── STATUS PILL ── */
.hdr-status{
  display:flex;align-items:center;gap:7px;
  background:rgba(12,128,117,.1);border:1px solid rgba(12,128,117,.2);
  padding:5px 12px;border-radius:999px;flex-shrink:0;margin-left:auto
}
.hdr-dot{width:5px;height:5px;background:var(--teal3);border-radius:50%;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-status span{font-size:11px;font-weight:600;color:var(--teal3);white-space:nowrap}

/* ── PHONE ── */
.hdr-phone{
  display:flex;align-items:center;gap:7px;
  font-size:13.5px;font-weight:700;color:var(--white);
  text-decoration:none;transition:color .15s;flex-shrink:0;white-space:nowrap
}
.hdr-phone:hover{color:var(--teal3)}
.hdr-phone svg{width:14px;height:14px;fill:var(--teal2)}

/* ── MOBILE BURGER ── */
.hdr-burger{
  display:none;background:none;border:none;cursor:pointer;
  padding:6px;flex-direction:column;gap:5px;margin-left:auto;flex-shrink:0
}
.hdr-burger span{
  display:block;width:22px;height:2px;
  background:var(--mist);border-radius:2px;transition:all .25s
}
.hdr-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hdr-burger.open span:nth-child(2){opacity:0}
.hdr-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* ── MOBILE DRAWER ── */
.hdr-mobile{
  display:none;background:var(--ink2);
  border-top:1px solid rgba(255,255,255,.07);
  padding:12px 16px 20px;flex-direction:column;gap:2px;
  max-height:calc(100vh - 70px);overflow-y:auto
}
.hdr-mobile.open{display:flex}
.hdr-mobile a,.hdr-mobile .m-label{
  font-size:14px;font-weight:500;color:var(--mist);
  text-decoration:none;padding:11px 14px;border-radius:var(--r8);
  transition:all .15s;display:block
}
.hdr-mobile a:hover{color:var(--white);background:rgba(255,255,255,.06)}
.m-label{
  font-size:10px;font-weight:700;color:rgba(255,255,255,.2);
  letter-spacing:.8px;padding:16px 14px 6px;
}
.m-divider{height:1px;background:rgba(255,255,255,.06);margin:6px 0}
.m-phone{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;color:var(--teal3) !important;
  margin-top:8px
}
.m-phone svg{width:16px;height:16px;fill:var(--teal2)}

/* ── RESPONSIVE ── */
@media(max-width:1060px){
  .hdr-status{display:none}
}
@media(max-width:900px){
  .hdr-nav,.hdr-phone{display:none}
  .hdr-burger{display:flex}
  .hdr-inner{padding:0 16px}
}


</style>
</head>

<script>
window.addEventListener('scroll',()=>{
  document.getElementById('siteHeader').classList.toggle('scrolled',window.scrollY>20);
},{passive:true});

function toggleMobile(){
  const nav=document.getElementById('mobileNav');
  const btn=document.getElementById('burger');
  const open=nav.classList.toggle('open');
  btn.classList.toggle('open',open);
  document.body.style.overflow=open?'hidden':'';
}
document.querySelectorAll('.hdr-mobile a').forEach(a=>{
  a.addEventListener('click',()=>{
    document.getElementById('mobileNav').classList.remove('open');
    document.getElementById('burger').classList.remove('open');
    document.body.style.overflow='';
  });
});
</script>
